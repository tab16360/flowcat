name: Build and test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/test.sh
      - run: bash scripts/package.sh
      - run: bash scripts/test-update-helper.sh
      - uses: actions/upload-artifact@v4
        with:
          name: FlowCat-arm64
          path: dist/*
